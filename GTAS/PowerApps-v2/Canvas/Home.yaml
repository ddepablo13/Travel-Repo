      OnSelect: "=Set(draft,ThisItem); Set(p,ParseJSON(draft.PayloadJson)); Set(d,{ownerEmail:Text(p.header.ownerEmail),contactEmail:Text(p.header.contactEmail),traveler:Text(p.header.traveler),supervisor:Text(p.header.supervisor),programKey:Text(p.header.programKey),organization:Text(p.header.organization),company:Text(p.header.company),purpose:Text(p.header.purpose),categories:Text(p.header.categories),region:Text(p.header.region),tripType:Text(p.header.tripType),departure:Text(p.header.departure),returnDate:Text(p.header.returnDate),air:Boolean(p.header.air),rental:Boolean(p.header.rental),pov:Boolean(p.header.pov),rail:Boolean(p.header.rail),airportMethod:Text(p.header.airportMethod),airfare:Value(p.header.airfare),airportCost:Value(p.header.airportCost),dropMiles:Value(p.header.dropMiles),miles:Value(p.header.miles),rentalCost:Value(p.header.rentalCost),fuel:Value(p.header.fuel),tolls:Value(p.header.tolls),railCost:Value(p.header.railCost),registration:Value(p.header.registration),misc:Value(p.header.misc),hotelParking:Value(p.header.hotelParking),resortFees:Value(p.header.resortFees)}); ClearCollect(stops,ForAll(Table(p.destinations),{key:Text(ThisRecord.Value.key),city:Text(ThisRecord.Value.city),region:Text(ThisRecord.Value.region),start:Text(ThisRecord.Value.start),rateId:Value(ThisRecord.Value.rateId),quote:Value(ThisRecord.Value.quote),justification:Text(ThisRecord.Value.justification)})); Set(parentRequestId,Value(p.parentRequestId)); Set(expectedCycle,Value(p.expectedCycle)); Set(commandKey,Text(GUID())); Set(dirty,false); Set(message,\"\"); Navigate(Traveler)"
      Visible: "=showDrafts"
