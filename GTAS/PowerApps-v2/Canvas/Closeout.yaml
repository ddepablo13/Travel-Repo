- CloseoutComplete:
    Control: "Classic/Button@2.2.0"
    Properties:
      Text: "=\"Mark travel completed\""
      X: "=28"
      Y: "=480"
      Width: "=250"
      Height: "=44"
      OnSelect: "=Set(busy,true); Set(message,\"\"); IfError(Set(lastCommand,Patch(GTASCommandsV2,Defaults(GTASCommandsV2),{Title:commandKey,Operation:\"Complete\",RequestId:r.ID,ExpectedCycle:Coalesce(r.Cycle,0),PayloadJson:JSON({},JSONFormat.Compact)})); Navigate(CommandStatus),Set(message,\"Could not queue the action. Retry with the same command key.\")); Set(busy,false)"
      Visible: "=r.Status=\"Approved\""
      DisplayMode: "=If(busy,DisplayMode.Disabled,DisplayMode.Edit)"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Fill: "=Theme.Accent"
      Color: "=Theme.Surface"
      BorderColor: "=Theme.Line"
      BorderThickness: "=1"
      RadiusTopLeft: "=6"
      RadiusTopRight: "=6"
      RadiusBottomLeft: "=6"
      RadiusBottomRight: "=6"
      FocusedBorderColor: "=Theme.Gold"
      FocusedBorderThickness: "=3"
      HoverFill: "=Theme.Navy"
      HoverColor: "=Theme.Surface"
      PressedFill: "=Theme.Navy"
      PressedColor: "=Theme.Surface"
      DisabledFill: "=Theme.Line"
      DisabledColor: "=Theme.Muted"
- CloseoutPost:
    Control: "Classic/Button@2.2.0"
    Properties:
      Text: "=\"Post actual and close\""
      X: "=310"
      Y: "=480"
      Width: "=250"
      Height: "=44"
      OnSelect: "=IfError(If(IsBlank(CloseoutActual.Text) || Value(CloseoutActual.Text)<0 || !IsMatch(CloseoutPosted.Text,\"\\d{4}-\\d{2}-\\d{2}\") || DateValue(CloseoutPosted.Text)>Today(),Set(message,\"Enter a nonnegative cost and valid posting date.\"),Set(busy,true); Set(message,\"\"); IfError(Set(lastCommand,Patch(GTASCommandsV2,Defaults(GTASCommandsV2),{Title:commandKey,Operation:\"Close\",RequestId:r.ID,ExpectedCycle:Coalesce(r.Cycle,0),PayloadJson:JSON({actual:Value(CloseoutActual.Text),posted:CloseoutPosted.Text,notes:CloseoutNotes.Text},JSONFormat.Compact)})); Navigate(CommandStatus),Set(message,\"Could not queue the action. Retry with the same command key.\")); Set(busy,false)),Set(message,\"Check cost and posting date.\"))"
      Visible: "=r.Status=\"Travel Completed\""
      DisplayMode: "=If(busy,DisplayMode.Disabled,DisplayMode.Edit)"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Fill: "=Theme.Accent"
      Color: "=Theme.Surface"
      BorderColor: "=Theme.Line"
      BorderThickness: "=1"
      RadiusTopLeft: "=6"
      RadiusTopRight: "=6"
      RadiusBottomLeft: "=6"
      RadiusBottomRight: "=6"
      FocusedBorderColor: "=Theme.Gold"
      FocusedBorderThickness: "=3"
      HoverFill: "=Theme.Navy"
      HoverColor: "=Theme.Surface"
      PressedFill: "=Theme.Navy"
      PressedColor: "=Theme.Surface"
      DisabledFill: "=Theme.Line"
      DisabledColor: "=Theme.Muted"
