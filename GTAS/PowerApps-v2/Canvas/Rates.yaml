- RatesMast:
    Control: "Rectangle@2.3.0"
    Properties:
      X: "=0"
      Y: "=0"
      Width: "=Parent.Width"
      Height: "=76"
      Fill: "=Theme.Navy"
      BorderThickness: "=0"
- RatesBrand:
    Control: "Label@2.5.1"
    Properties:
      Text: "=\"GTAS\""
      X: "=28"
      Y: "=16"
      Width: "=120"
      Height: "=44"
      Font: "=Font.SegoeUI"
      Size: "=25"
      Color: "=Theme.Surface"
      FontWeight: "=FontWeight.Semibold"
- RatesIdentity:
    Control: "Label@2.5.1"
    Properties:
      Text: "=User().FullName"
      X: "=820"
      Y: "=20"
      Width: "=340"
      Height: "=36"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Color: "=Theme.Surface"
      Align: "=Align.Right"
- RatesRule:
    Control: "Rectangle@2.3.0"
    Properties:
      X: "=0"
      Y: "=76"
      Width: "=Parent.Width"
      Height: "=3"
      Fill: "=Theme.Gold"
      BorderThickness: "=0"
- RatesTitle:
    Control: "Label@2.5.1"
    Properties:
      Text: "=\"Approved travel rates\""
      X: "=28"
      Y: "=100"
      Width: "=900"
      Height: "=44"
      Font: "=Font.SegoeUI"
      Size: "=25"
      Color: "=Theme.Ink"
      FontWeight: "=FontWeight.Semibold"
- RatesSubtitle:
    Control: "Label@2.5.1"
    Properties:
      Text: "=\"Use the rate ID matching the destination and dates. Missing rates require coordinator review.\""
      X: "=28"
      Y: "=150"
      Width: "=1120"
      Height: "=40"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Color: "=Theme.Ink"
- RatesMessage:
    Control: "Label@2.5.1"
    Properties:
      Text: "=message"
      X: "=28"
      Y: "=620"
      Width: "=1120"
      Height: "=48"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Color: "=Theme.Error"
      Live: "=Live.Assertive"
- RatesRates:
    Control: "Gallery@2.15.0"
    Properties:
      Items: "=SortByColumns(GTASRatesV2,\"Title\")"
      X: "=28"
      Y: "=210"
      Width: "=1128"
      Height: "=370"
      TemplateSize: "=80"
      TemplatePadding: "=4"
      TemplateFill: "=Theme.Surface"
      OnSelect: "=Set(message,\"Use rate ID \" & Text(ThisItem.ID) & \" for \" & ThisItem.Title)"
    Children:
      - RatesRatesText0:
          Control: "Label@2.5.1"
          Properties:
            Text: "=Text(ThisItem.ID) & \" / \" & ThisItem.Title"
            X: "=12"
            Y: "=12"
            Width: "=400"
            Height: "=54"
            Font: "=Font.SegoeUI"
            Size: "=12"
            Color: "=Theme.Ink"
            OnSelect: "=Select(Parent)"
      - RatesRatesText1:
          Control: "Label@2.5.1"
          Properties:
            Text: "=Text(ThisItem.EffectiveFrom,\"mmm d, yyyy\") & \" to \" & Text(ThisItem.EffectiveTo,\"mmm d, yyyy\")"
            X: "=420"
            Y: "=12"
            Width: "=300"
            Height: "=54"
            Font: "=Font.SegoeUI"
            Size: "=12"
            Color: "=Theme.Ink"
            OnSelect: "=Select(Parent)"
      - RatesRatesText2:
          Control: "Label@2.5.1"
          Properties:
            Text: "=Text(ThisItem.Lodging,\"$0.00\") & \" / \" & Text(ThisItem.Mie,\"$0.00\")"
            X: "=740"
            Y: "=12"
            Width: "=220"
            Height: "=54"
            Font: "=Font.SegoeUI"
            Size: "=12"
            Color: "=Theme.Ink"
            OnSelect: "=Select(Parent)"
      - RatesRatesOpen:
          Control: "Classic/Button@2.2.0"
          Properties:
            Text: "=\"Open\""
            X: "=970"
            Y: "=16"
            Width: "=110"
            Height: "=40"
            OnSelect: "=Select(Parent)"
            Fill: "=Theme.Accent"
            Color: "=Theme.Surface"
            Font: "=Font.SegoeUI"
            Size: "=12"
- RatesReturn:
    Control: "Classic/Button@2.2.0"
    Properties:
      Text: "=\"Back to itinerary\""
      X: "=28"
      Y: "=672"
      Width: "=200"
      Height: "=44"
      OnSelect: "=Navigate(Itinerary)"
      Visible: "=true"
      DisplayMode: "=If(busy,DisplayMode.Disabled,DisplayMode.Edit)"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Fill: "=Theme.Surface"
      Color: "=Theme.Accent"
      BorderColor: "=Theme.Line"
      BorderThickness: "=1"
      RadiusTopLeft: "=6"
      RadiusTopRight: "=6"
      RadiusBottomLeft: "=6"
      RadiusBottomRight: "=6"
      FocusedBorderColor: "=Theme.Gold"
      FocusedBorderThickness: "=3"
      HoverFill: "=Theme.Navy"
      HoverColor: "=Theme.Surface"
      PressedFill: "=Theme.Navy"
      PressedColor: "=Theme.Surface"
      DisabledFill: "=Theme.Line"
      DisabledColor: "=Theme.Muted"
