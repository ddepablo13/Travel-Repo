- ReportsExport:
    Control: "Classic/Button@2.2.0"
    Properties:
      Text: "=\"Generate monthly report\""
      X: "=28"
      Y: "=350"
      Width: "=290"
      Height: "=44"
      OnSelect: "=If(!IsMatch(ReportsMonth.Text,\"\\d{4}-(0[1-9]|1[0-2])\") || CountIf(access,ProgramKey=Trim(ReportsProgram.Text) && CanReport)=0,Set(message,\"Select a valid month and an authorized program.\"),Set(commandKey,Text(GUID())); Set(busy,true); Set(message,\"\"); IfError(Set(lastCommand,Patch(GTASCommandsV2,Defaults(GTASCommandsV2),{Title:commandKey,Operation:\"Report\",RequestId:0,ExpectedCycle:Coalesce(r.Cycle,0),PayloadJson:JSON({programKey:Trim(ReportsProgram.Text),month:ReportsMonth.Text},JSONFormat.Compact)})); Navigate(CommandStatus),Set(message,\"Could not queue the action. Retry with the same command key.\")); Set(busy,false))"
      Visible: "=true"
      DisplayMode: "=If(busy,DisplayMode.Disabled,DisplayMode.Edit)"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Fill: "=Theme.Accent"
      Color: "=Theme.Surface"
      BorderColor: "=Theme.Line"
      BorderThickness: "=1"
      RadiusTopLeft: "=6"
      RadiusTopRight: "=6"
      RadiusBottomLeft: "=6"
      RadiusBottomRight: "=6"
      FocusedBorderColor: "=Theme.Gold"
      FocusedBorderThickness: "=3"
      HoverFill: "=Theme.Navy"
      HoverColor: "=Theme.Surface"
      PressedFill: "=Theme.Navy"
      PressedColor: "=Theme.Surface"
      DisabledFill: "=Theme.Line"
      DisabledColor: "=Theme.Muted"
