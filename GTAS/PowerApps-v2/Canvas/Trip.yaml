    Properties:
      Text: "=\"Save draft\""
      X: "=144"
      Y: "=672"
      Width: "=140"
      Height: "=44"
      OnSelect: "=Set(busy,true); Set(message,\"\"); IfError(Set(draft,Patch(GTASDraftsV2,If(IsBlank(draft),Defaults(GTASDraftsV2),draft),{Title:Coalesce(draft.Title,\"Draft \" & Text(Now(),\"yyyy-mm-dd hh:mm\")),PayloadJson:JSON({schemaVersion:2,header:d,destinations:stops,parentRequestId:parentRequestId,expectedCycle:expectedCycle},JSONFormat.Compact)})); Set(dirty,false); Set(message,\"Draft saved.\"),Set(message,\"Save failed. Your entries are still on this screen.\")); Set(busy,false)"
      Visible: "=true"
      DisplayMode: "=If(busy,DisplayMode.Disabled,DisplayMode.Edit)"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Fill: "=Theme.Surface"
      Color: "=Theme.Accent"
