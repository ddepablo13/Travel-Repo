- DecisionApprove:
    Control: "Classic/Button@2.2.0"
    Properties:
      Text: "=\"Approve\""
      X: "=28"
      Y: "=558"
      Width: "=170"
      Height: "=44"
      OnSelect: "=Set(busy,true); Set(message,\"\"); IfError(Set(lastCommand,Patch(GTASCommandsV2,Defaults(GTASCommandsV2),{Title:commandKey,Operation:\"Decide\",RequestId:r.ID,ExpectedCycle:Coalesce(r.Cycle,0),PayloadJson:JSON({outcome:\"Approve\",comment:DecisionComments.Text,expectedStage:r.Status},JSONFormat.Compact)})); Navigate(CommandStatus),Set(message,\"Could not queue the action. Retry with the same command key.\")); Set(busy,false)"
      Visible: "=r.AssignedEmail=Lower(User().Email)"
      DisplayMode: "=If(busy,DisplayMode.Disabled,DisplayMode.Edit)"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Fill: "=Theme.Accent"
      Color: "=Theme.Surface"
