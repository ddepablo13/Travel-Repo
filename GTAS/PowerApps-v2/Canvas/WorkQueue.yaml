- WorkQueueMast:
    Control: "Rectangle@2.3.0"
    Properties:
      X: "=0"
      Y: "=0"
      Width: "=Parent.Width"
      Height: "=76"
      Fill: "=Theme.Navy"
      BorderThickness: "=0"
- WorkQueueBrand:
    Control: "Label@2.5.1"
    Properties:
      Text: "=\"GTAS\""
      X: "=28"
      Y: "=16"
      Width: "=120"
      Height: "=44"
      Font: "=Font.SegoeUI"
      Size: "=25"
      Color: "=Theme.Surface"
      FontWeight: "=FontWeight.Semibold"
- WorkQueueIdentity:
    Control: "Label@2.5.1"
    Properties:
      Text: "=User().FullName"
      X: "=820"
      Y: "=20"
      Width: "=340"
      Height: "=36"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Color: "=Theme.Surface"
      Align: "=Align.Right"
- WorkQueueRule:
    Control: "Rectangle@2.3.0"
    Properties:
      X: "=0"
      Y: "=76"
      Width: "=Parent.Width"
      Height: "=3"
      Fill: "=Theme.Gold"
      BorderThickness: "=0"
- WorkQueueTitle:
    Control: "Label@2.5.1"
    Properties:
      Text: "=\"Work queue\""
      X: "=28"
      Y: "=100"
      Width: "=900"
      Height: "=44"
      Font: "=Font.SegoeUI"
      Size: "=25"
      Color: "=Theme.Ink"
      FontWeight: "=FontWeight.Semibold"
- WorkQueueSubtitle:
    Control: "Label@2.5.1"
    Properties:
      Text: "=\"Requests shared with you for coordination or approval.\""
      X: "=28"
      Y: "=150"
      Width: "=1120"
      Height: "=40"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Color: "=Theme.Ink"
- WorkQueueMessage:
    Control: "Label@2.5.1"
    Properties:
      Text: "=message"
      X: "=28"
      Y: "=620"
      Width: "=1120"
      Height: "=48"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Color: "=Theme.Error"
      Live: "=Live.Assertive"
- WorkQueueQueue:
    Control: "Gallery@2.15.0"
    Properties:
      Items: "=SortByColumns(GTASRequestsV2,\"Modified\",SortOrder.Descending)"
      X: "=28"
      Y: "=210"
      Width: "=1128"
      Height: "=380"
      TemplateSize: "=80"
      TemplatePadding: "=4"
      TemplateFill: "=Theme.Surface"
      OnSelect: "=Set(r,ThisItem); Navigate(Request)"
    Children:
      - WorkQueueQueueText0:
          Control: "Label@2.5.1"
          Properties:
            Text: "=ThisItem.Title & Char(10) & ThisItem.Traveler"
            X: "=12"
            Y: "=12"
            Width: "=400"
            Height: "=54"
            Font: "=Font.SegoeUI"
            Size: "=12"
            Color: "=Theme.Ink"
            OnSelect: "=Select(Parent)"
      - WorkQueueQueueText1:
          Control: "Label@2.5.1"
          Properties:
            Text: "=ThisItem.Status"
            X: "=430"
            Y: "=12"
            Width: "=250"
            Height: "=54"
            Font: "=Font.SegoeUI"
            Size: "=12"
            Color: "=Theme.Ink"
            OnSelect: "=Select(Parent)"
      - WorkQueueQueueText2:
          Control: "Label@2.5.1"
          Properties:
            Text: "=ThisItem.ProgramKey"
            X: "=710"
            Y: "=12"
            Width: "=210"
            Height: "=54"
            Font: "=Font.SegoeUI"
            Size: "=12"
            Color: "=Theme.Ink"
            OnSelect: "=Select(Parent)"
      - WorkQueueQueueOpen:
          Control: "Classic/Button@2.2.0"
          Properties:
            Text: "=\"Open\""
            X: "=970"
            Y: "=16"
            Width: "=110"
            Height: "=40"
            OnSelect: "=Select(Parent)"
            Fill: "=Theme.Accent"
            Color: "=Theme.Surface"
            Font: "=Font.SegoeUI"
            Size: "=12"
- WorkQueueHome:
    Control: "Classic/Button@2.2.0"
    Properties:
      Text: "=\"My requests\""
      X: "=28"
      Y: "=672"
      Width: "=160"
      Height: "=44"
      OnSelect: "=Navigate(Home)"
      Visible: "=true"
      DisplayMode: "=If(busy,DisplayMode.Disabled,DisplayMode.Edit)"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Fill: "=Theme.Surface"
      Color: "=Theme.Accent"
      BorderColor: "=Theme.Line"
      BorderThickness: "=1"
      RadiusTopLeft: "=6"
      RadiusTopRight: "=6"
      RadiusBottomLeft: "=6"
      RadiusBottomRight: "=6"
      FocusedBorderColor: "=Theme.Gold"
      FocusedBorderThickness: "=3"
      HoverFill: "=Theme.Navy"
      HoverColor: "=Theme.Surface"
      PressedFill: "=Theme.Navy"
      PressedColor: "=Theme.Surface"
      DisabledFill: "=Theme.Line"
      DisabledColor: "=Theme.Muted"
