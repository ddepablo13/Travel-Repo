- CommandStatusMast:
    Control: "Rectangle@2.3.0"
    Properties:
      X: "=0"
      Y: "=0"
      Width: "=Parent.Width"
      Height: "=76"
      Fill: "=Theme.Navy"
      BorderThickness: "=0"
- CommandStatusBrand:
    Control: "Label@2.5.1"
    Properties:
      Text: "=\"GTAS\""
      X: "=28"
      Y: "=16"
      Width: "=120"
      Height: "=44"
      Font: "=Font.SegoeUI"
      Size: "=25"
      Color: "=Theme.Surface"
      FontWeight: "=FontWeight.Semibold"
- CommandStatusIdentity:
    Control: "Label@2.5.1"
    Properties:
      Text: "=User().FullName"
      X: "=820"
      Y: "=20"
      Width: "=340"
      Height: "=36"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Color: "=Theme.Surface"
      Align: "=Align.Right"
- CommandStatusRule:
    Control: "Rectangle@2.3.0"
    Properties:
      X: "=0"
      Y: "=76"
      Width: "=Parent.Width"
      Height: "=3"
      Fill: "=Theme.Gold"
      BorderThickness: "=0"
- CommandStatusTitle:
    Control: "Label@2.5.1"
    Properties:
      Text: "=\"Request processing\""
      X: "=28"
      Y: "=100"
      Width: "=900"
      Height: "=44"
      Font: "=Font.SegoeUI"
      Size: "=25"
      Color: "=Theme.Ink"
      FontWeight: "=FontWeight.Semibold"
- CommandStatusSubtitle:
    Control: "Label@2.5.1"
    Properties:
      Text: "=\"The service validates ownership, policy and workflow before accepting a change.\""
      X: "=28"
      Y: "=150"
      Width: "=1120"
      Height: "=40"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Color: "=Theme.Ink"
- CommandStatusMessage:
    Control: "Label@2.5.1"
    Properties:
      Text: "=message"
      X: "=28"
      Y: "=620"
      Width: "=1120"
      Height: "=48"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Color: "=Theme.Error"
      Live: "=Live.Assertive"
- CommandStatusStatus:
    Control: "Label@2.5.1"
    Properties:
      Text: "=Coalesce(lastCommand.State,\"Queued\") & Char(10) & Coalesce(lastCommand.ResultMessage,\"Waiting for processing.\")"
      X: "=28"
      Y: "=220"
      Width: "=1080"
      Height: "=160"
      Font: "=Font.SegoeUI"
      Size: "=18"
      Color: "=Theme.Ink"
- CommandStatusPoll:
    Control: "Timer@2.1.0"
    Properties:
      Duration: "=5000"
      Repeat: "=true"
      AutoStart: "=true"
      Visible: "=false"
      Start: "=App.ActiveScreen=CommandStatus && !(lastCommand.State in [\"Succeeded\",\"Rejected\",\"Failed\"])"
      OnTimerEnd: "=Refresh(GTASCommandsV2); Set(lastCommand,LookUp(GTASCommandsV2,ID=lastCommand.ID))"
      X: "=28"
      Y: "=450"
      Width: "=100"
      Height: "=40"
- CommandStatusRequests:
    Control: "Classic/Button@2.2.0"
    Properties:
      Text: "=\"My requests\""
      X: "=28"
      Y: "=672"
      Width: "=170"
      Height: "=44"
      OnSelect: "=Refresh(GTASRequestsV2); Navigate(Home)"
      Visible: "=true"
      DisplayMode: "=If(busy,DisplayMode.Disabled,DisplayMode.Edit)"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Fill: "=Theme.Surface"
      Color: "=Theme.Accent"
      BorderColor: "=Theme.Line"
      BorderThickness: "=1"
      RadiusTopLeft: "=6"
      RadiusTopRight: "=6"
      RadiusBottomLeft: "=6"
      RadiusBottomRight: "=6"
      FocusedBorderColor: "=Theme.Gold"
      FocusedBorderThickness: "=3"
      HoverFill: "=Theme.Navy"
      HoverColor: "=Theme.Surface"
      PressedFill: "=Theme.Navy"
      PressedColor: "=Theme.Surface"
      DisabledFill: "=Theme.Line"
      DisabledColor: "=Theme.Muted"
- CommandStatusView:
    Control: "Classic/Button@2.2.0"
    Properties:
      Text: "=\"View request\""
      X: "=940"
      Y: "=672"
      Width: "=220"
      Height: "=44"
      OnSelect: "=Refresh(GTASRequestsV2); Set(r,LookUp(GTASRequestsV2,ID=lastCommand.ResultRequestId)); If(IsBlank(r),Set(message,\"Access is still being provisioned. Try again shortly.\"),Navigate(Request))"
      Visible: "=lastCommand.State=\"Succeeded\" && lastCommand.ResultRequestId>0"
      DisplayMode: "=If(busy,DisplayMode.Disabled,DisplayMode.Edit)"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Fill: "=Theme.Accent"
      Color: "=Theme.Surface"
      BorderColor: "=Theme.Line"
      BorderThickness: "=1"
      RadiusTopLeft: "=6"
      RadiusTopRight: "=6"
      RadiusBottomLeft: "=6"
      RadiusBottomRight: "=6"
      FocusedBorderColor: "=Theme.Gold"
      FocusedBorderThickness: "=3"
      HoverFill: "=Theme.Navy"
      HoverColor: "=Theme.Surface"
      PressedFill: "=Theme.Navy"
      PressedColor: "=Theme.Surface"
      DisabledFill: "=Theme.Line"
      DisabledColor: "=Theme.Muted"
- CommandStatusReportLink:
    Control: "Classic/Button@2.2.0"
    Properties:
      Text: "=\"Download report\""
      X: "=650"
      Y: "=672"
      Width: "=250"
      Height: "=44"
      OnSelect: "=Launch(lastCommand.ResultUrl)"
      Visible: "=lastCommand.State=\"Succeeded\" && !IsBlank(lastCommand.ResultUrl)"
      DisplayMode: "=If(busy,DisplayMode.Disabled,DisplayMode.Edit)"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Fill: "=Theme.Surface"
      Color: "=Theme.Accent"
      BorderColor: "=Theme.Line"
      BorderThickness: "=1"
      RadiusTopLeft: "=6"
      RadiusTopRight: "=6"
      RadiusBottomLeft: "=6"
      RadiusBottomRight: "=6"
      FocusedBorderColor: "=Theme.Gold"
      FocusedBorderThickness: "=3"
      HoverFill: "=Theme.Navy"
      HoverColor: "=Theme.Surface"
      PressedFill: "=Theme.Navy"
      PressedColor: "=Theme.Surface"
      DisabledFill: "=Theme.Line"
      DisabledColor: "=Theme.Muted"
