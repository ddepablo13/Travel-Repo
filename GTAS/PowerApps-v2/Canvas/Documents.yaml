- DocumentsMast:
    Control: "Rectangle@2.3.0"
    Properties:
      X: "=0"
      Y: "=0"
      Width: "=Parent.Width"
      Height: "=76"
      Fill: "=Theme.Navy"
      BorderThickness: "=0"
- DocumentsBrand:
    Control: "Label@2.5.1"
    Properties:
      Text: "=\"GTAS\""
      X: "=28"
      Y: "=16"
      Width: "=120"
      Height: "=44"
      Font: "=Font.SegoeUI"
      Size: "=25"
      Color: "=Theme.Surface"
      FontWeight: "=FontWeight.Semibold"
- DocumentsIdentity:
    Control: "Label@2.5.1"
    Properties:
      Text: "=User().FullName"
      X: "=820"
      Y: "=20"
      Width: "=340"
      Height: "=36"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Color: "=Theme.Surface"
      Align: "=Align.Right"
- DocumentsRule:
    Control: "Rectangle@2.3.0"
    Properties:
      X: "=0"
      Y: "=76"
      Width: "=Parent.Width"
      Height: "=3"
      Fill: "=Theme.Gold"
      BorderThickness: "=0"
- DocumentsTitle:
    Control: "Label@2.5.1"
    Properties:
      Text: "=\"Supporting documents\""
      X: "=28"
      Y: "=100"
      Width: "=900"
      Height: "=44"
      Font: "=Font.SegoeUI"
      Size: "=25"
      Color: "=Theme.Ink"
      FontWeight: "=FontWeight.Semibold"
- DocumentsSubtitle:
    Control: "Label@2.5.1"
    Properties:
      Text: "=\"Save file additions or removals before returning to the request.\""
      X: "=28"
      Y: "=150"
      Width: "=1120"
      Height: "=40"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Color: "=Theme.Ink"
- DocumentsMessage:
    Control: "Label@2.5.1"
    Properties:
      Text: "=message"
      X: "=28"
      Y: "=620"
      Width: "=1120"
      Height: "=48"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Color: "=Theme.Error"
      Live: "=Live.Assertive"
- DocumentsSlot:
    Control: "Label@2.5.1"
    Properties:
      Text: "=\"Use the attachments form below.\""
      X: "=28"
      Y: "=202"
      Width: "=1000"
      Height: "=32"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Color: "=Theme.Ink"
- DocumentsSaveFiles:
    Control: "Classic/Button@2.2.0"
    Properties:
      Text: "=\"Save documents\""
      X: "=28"
      Y: "=672"
      Width: "=190"
      Height: "=44"
      OnSelect: "=Set(busy,true); SubmitForm(DocumentsForm)"
      Visible: "=true"
      DisplayMode: "=If(busy,DisplayMode.Disabled,DisplayMode.Edit)"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Fill: "=Theme.Accent"
      Color: "=Theme.Surface"
      BorderColor: "=Theme.Line"
      BorderThickness: "=1"
      RadiusTopLeft: "=6"
      RadiusTopRight: "=6"
      RadiusBottomLeft: "=6"
      RadiusBottomRight: "=6"
      FocusedBorderColor: "=Theme.Gold"
      FocusedBorderThickness: "=3"
      HoverFill: "=Theme.Navy"
      HoverColor: "=Theme.Surface"
      PressedFill: "=Theme.Navy"
      PressedColor: "=Theme.Surface"
      DisabledFill: "=Theme.Line"
      DisabledColor: "=Theme.Muted"
- DocumentsCancel:
    Control: "Classic/Button@2.2.0"
    Properties:
      Text: "=\"Discard file changes\""
      X: "=234"
      Y: "=672"
      Width: "=220"
      Height: "=44"
      OnSelect: "=ResetForm(DocumentsForm); Navigate(Expenses)"
      Visible: "=true"
      DisplayMode: "=If(busy,DisplayMode.Disabled,DisplayMode.Edit)"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Fill: "=Theme.Surface"
      Color: "=Theme.Accent"
      BorderColor: "=Theme.Line"
      BorderThickness: "=1"
      RadiusTopLeft: "=6"
      RadiusTopRight: "=6"
      RadiusBottomLeft: "=6"
      RadiusBottomRight: "=6"
      FocusedBorderColor: "=Theme.Gold"
      FocusedBorderThickness: "=3"
      HoverFill: "=Theme.Navy"
      HoverColor: "=Theme.Surface"
      PressedFill: "=Theme.Navy"
      PressedColor: "=Theme.Surface"
      DisabledFill: "=Theme.Line"
      DisabledColor: "=Theme.Muted"
