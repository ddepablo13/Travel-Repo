- SubmitSubmit:
    Control: "Classic/Button@2.2.0"
    Properties:
      Text: "=\"Submit request\""
      X: "=940"
      Y: "=672"
      Width: "=220"
      Height: "=44"
      OnSelect: "=If(!IsBlank(DraftIssue),Set(message,DraftIssue),Set(busy,true); Set(message,\"\"); IfError(Set(draft,Patch(GTASDraftsV2,If(IsBlank(draft),Defaults(GTASDraftsV2),draft),{Title:Coalesce(draft.Title,\"Draft \" & Text(Now(),\"yyyy-mm-dd hh:mm\")),PayloadJson:JSON({schemaVersion:2,header:d,destinations:stops,parentRequestId:parentRequestId,expectedCycle:expectedCycle},JSONFormat.Compact)})); Set(dirty,false); Set(message,\"Draft saved.\"),Set(message,\"Save failed. Your entries are still on this screen.\")); Set(busy,false); If(!dirty && !IsBlank(draft),Set(busy,true); IfError(Set(lastCommand,Patch(GTASCommandsV2,Defaults(GTASCommandsV2),{Title:commandKey,Operation:\"Submit\",RequestId:parentRequestId,ExpectedCycle:expectedCycle,PayloadJson:JSON({draftId:draft.ID,snapshot:ParseJSON(draft.PayloadJson)},JSONFormat.Compact)})); Set(message,\"Submission queued. Processing will confirm the result.\"); Navigate(CommandStatus),Set(message,\"Submission could not be queued. Retry with the same command key.\")); Set(busy,false)))"
      Visible: "=true"
      DisplayMode: "=If(busy,DisplayMode.Disabled,DisplayMode.Edit)"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Fill: "=Theme.Accent"
      Color: "=Theme.Surface"
      BorderColor: "=Theme.Line"
      BorderThickness: "=1"
      RadiusTopLeft: "=6"
      RadiusTopRight: "=6"
      RadiusBottomLeft: "=6"
      RadiusBottomRight: "=6"
      FocusedBorderColor: "=Theme.Gold"
      FocusedBorderThickness: "=3"
      HoverFill: "=Theme.Navy"
      HoverColor: "=Theme.Surface"
      PressedFill: "=Theme.Navy"
      PressedColor: "=Theme.Surface"
      DisabledFill: "=Theme.Line"
      DisabledColor: "=Theme.Muted"
