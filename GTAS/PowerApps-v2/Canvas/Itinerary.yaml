- ItineraryAdd:
    Control: "Classic/Button@2.2.0"
    Properties:
      Text: "=\"Add destination\""
      X: "=914"
      Y: "=330"
      Width: "=210"
      Height: "=44"
      OnSelect: "=IfError(If(IsBlank(Trim(ItineraryCity.Text)) || IsBlank(Trim(ItineraryRegion.Text)) || !IsMatch(ItineraryStart.Text,\"\\d{4}-\\d{2}-\\d{2}\") || DateValue(ItineraryStart.Text)<DateValue(d.departure) || DateValue(ItineraryStart.Text)>DateValue(d.returnDate) || CountIf(stops,start=ItineraryStart.Text)>0 || (d.tripType=\"Overnight\" && IsBlank(LookUp(GTASRatesV2,ID=Value(ItineraryRateId.Text)))),Set(message,\"Check destination, unique start date and approved rate ID.\"),Collect(stops,{key:Text(GUID()),city:Trim(ItineraryCity.Text),region:Trim(ItineraryRegion.Text),start:ItineraryStart.Text,rateId:If(d.tripType=\"Overnight\",Value(ItineraryRateId.Text),0),quote:Coalesce(Value(ItineraryQuote.Text),0),justification:Trim(ItineraryWhy.Text)}); Set(dirty,true); Set(message,\"Destination added.\")),Set(message,\"Enter a valid date and numeric rate ID and quote.\"))"
      Visible: "=true"
      DisplayMode: "=If(busy,DisplayMode.Disabled,DisplayMode.Edit)"
      Font: "=Font.SegoeUI"
      Size: "=12"
      Fill: "=Theme.Accent"
      Color: "=Theme.Surface"
      BorderColor: "=Theme.Line"
      BorderThickness: "=1"
      RadiusTopLeft: "=6"
      RadiusTopRight: "=6"
      RadiusBottomLeft: "=6"
      RadiusBottomRight: "=6"
      FocusedBorderColor: "=Theme.Gold"
      FocusedBorderThickness: "=3"
      HoverFill: "=Theme.Navy"
      HoverColor: "=Theme.Surface"
      PressedFill: "=Theme.Navy"
      PressedColor: "=Theme.Surface"
      DisabledFill: "=Theme.Line"
      DisabledColor: "=Theme.Muted"
