<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="GTAS travel requests, approvals and authorized cost reporting."><title>GTAS | Travel authorizations</title>
<style>/* Hallmark v2.0.0 | shape: app screen | theme: NNSA custom | signature: travel queue */
/* Critique: compact agency masthead and clear operational rows. */
:root{--font-body:Arial,Helvetica,sans-serif;--font-heading:Georgia,serif;--color-0:#f4f6f9;--color-1:#293340;--color-2:#1a204c;--color-3:#fcfdff;--color-4:#d9dfea;--color-5:#21409a;--color-6:#ffffffed;--color-7:#1a204c0b;--color-8:#8b96ab;--color-9:#52565c;--color-10:#e8edf8;--color-11:#8b321e;--color-12:#ffbe2e;--color-13:#1a204c12;--paper:#fcfdff;}
*{box-sizing:border-box}body{margin:0;background:var(--color-0);color:var(--color-1);font:16px/1.5 var(--font-body)}header{background:var(--color-2);color:var(--color-3);padding:24px max(5vw,20px);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}main{max-width:1100px;margin:auto;padding:32px 20px}h1{font:clamp(2rem,5vw,3.5rem)/1 var(--font-heading);margin:12px 0 20px}h2{font:1.55rem var(--font-heading)}small{color:inherit}button,select,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--color-4);border-radius:7px;background:var(--paper);color:var(--color-5);padding:8px 16px}button.primary{background:var(--color-5);color:var(--paper)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--color-5);outline-offset:2px}section,fieldset{background:var(--color-3)fffed;border:1px solid var(--color-4);border-radius:12px;padding:20px;margin:16px 0;box-shadow:0 8px 24px var(--color-2)0b}fieldset{min-width:0}legend{font-weight:700;color:var(--color-5)}label{display:grid;gap:4px;align-content:start}input,textarea,select{width:100%;min-width:0;border:1px solid var(--color-8);border-radius:6px;padding:8px;background:var(--paper);color:var(--color-1)}input[type=checkbox]{width:auto}select[multiple]{height:120px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row{display:grid;grid-template-columns:2fr 1.3fr 1fr auto;align-items:center;gap:12px;padding:16px 0;border-top:1px solid var(--color-4)}.muted{color:var(--color-9)}.pill{background:var(--color-10);color:var(--color-5);padding:4px 12px;border-radius:20px;width:fit-content}header label{display:flex;align-items:center}header select{width:auto}#notice{color:var(--color-11)}button[disabled]{background:var(--color-6);color:var(--color-9);cursor:not-allowed} @media(max-width:600px){.row{grid-template-columns:1fr 1fr}}@media print{header,nav,button,#notice{display:none!important}main{padding:0}body{background:var(--paper)}}
html,body{overflow-x:clip}header{border-bottom:4px solid var(--color-12);padding-top:32px;padding-bottom:32px}header strong{font-size:28px}main{max-width:1240px}nav{position:sticky;top:0;background:var(--color-3)fffed;backdrop-filter:blur(16px);padding:16px 0;border-bottom:1px solid var(--color-4);z-index:2}h1{font-size:36px;overflow-wrap:break-word;min-width:0;margin-top:32px}section{padding:24px;border-radius:8px}.row{padding:24px 0}button{min-height:44px}button:hover{box-shadow:0 3px 10px var(--color-2)12}textarea:focus-visible{outline:3px solid var(--color-5)}fieldset{border-radius:8px;margin:24px 0;padding:24px}legend{padding:0 8px}input,select{min-height:44px}label{font-size:14px;font-weight:600}.grid{gap:20px}@media(max-width:600px){h1{font-size:28px}header{padding:20px}fieldset,section{padding:16px}}button:active{transform:translateY(1px)}h1,h2{text-wrap:balance}section,fieldset{box-shadow:none}header small{display:block;margin-top:4px}nav button{border-color:transparent}nav button:hover{background:var(--color-6)}nav button.primary:hover{background:var(--color-2)}#estimate{border-left:4px solid var(--color-2)}@media(prefers-reduced-motion:reduce){button:active{transform:none}}</style>
<header><div><strong>GTAS</strong> &nbsp; Travel authorization workspace<br><small>GDIT Travel Authorization System</small></div><label>Workspace role <select id="role"><option>Traveler<option>GTAS Coordinator<option>Program Manager<option>IT OPS<option>COR</select></label></header>
<noscript>This interactive demo requires JavaScript. Deployment instructions are in START-HERE.md.</noscript><main><nav class="bar" aria-label="Workspace"><button data-act="home">Requests</button><button data-act="report">Monthly report</button><button class="primary" data-act="new">New request</button></nav><p id="notice" role="alert"></p><div id="view"></div></main>
<script>
'use strict';
const KEY='gtas-leadership-v1';
const sampleRates={Arlington:[185,80],Richmond:[140,74],Denver:[170,80]};
const stages=['Program Manager','IT OPS','COR'];
const purposes=['Conference','Meeting','Site Visit','Training','Other'];
const iso=(d=new Date())=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const day=(d)=>Date.parse(d+'T00:00:00Z')/86400000;
const today=iso(), dateOffset=n=>new Date((day(today)+n)*86400000).toISOString().slice(0,10);
const stop=()=>({city:'',region:'',start:today,lodge:'',mie:'',quote:0,why:''});
const blank=()=>({name:'',email:'',supervisor:'',org:'GDIT',company:'',purpose:'',types:[],region:'Domestic',trip:'Overnight',start:today,end:dateOffset(2),stops:[stop()],airport:'Parking',files:[],log:[],status:'Draft',cycle:0});
const seed=(id,name,city,status,actual)=>({...blank(),id,name,supervisor:'Taylor Brooks',purpose:'Program delivery review',types:['Meeting'],start:dateOffset(-6),end:dateOffset(-4),stops:[{city,region:city==='Denver'?'CO':'VA',start:dateOffset(-6),lodge:sampleRates[city][0],mie:sampleRates[city][1],quote:125,why:''}],air:true,airfare:310,airportCost:45,status,total:status==='Draft'?null:355+2*sampleRates[city][0]+2.5*sampleRates[city][1],actual,posted:actual==null?'':today,approved:actual==null?'':dateOffset(-8)});
let db;
try{db=JSON.parse(localStorage.getItem(KEY))}catch{}
db ||= {next:4,requests:[seed(1,'Morgan Ellis','Arlington','Draft'),seed(2,'Avery Chen','Richmond','Program Manager'),seed(3,'Jordan Rivera','Denver','Closed',763)]};
let current=null, page='home', month=today.slice(0,7);
const $=s=>document.querySelector(s), role=()=>$('#role').value, view=$('#view');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd=n=>n==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);
const number=r=>r.number||'GTAS-'+r.start.slice(0,4)+'-'+String(r.id).padStart(5,'0');
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{$('#notice').textContent='Browser storage unavailable. Changes are in memory only.';return false}};
function cost(r){
 let lodging=0,mie=0;
 for(let i=0;i<r.stops.length;i++){const s=r.stops[i], a=day(s.start), b=i+1<r.stops.length?day(r.stops[i+1].start):day(r.end)+1;
 if(r.trip==='Overnight'&&Number.isFinite(a)&&Number.isFinite(b)){
 const nights=Math.max(0,Math.min(b,day(r.end))-a);
 lodging+=nights*Number(s.lodge);
 const days=Math.max(0,b-a), first=a===day(r.start), last=b===day(r.end)+1;
 mie+=(days-.25*Number(first&&days>0)-.25*Number(last&&days>0))*Number(s.mie);
 }}
 const charge=k=>Number(r[k]||0);
 const transport=(r.air?charge('airfare')+(r.airport==='Dropped Off'?charge('dropMiles')*charge('mileRate'):charge('airportCost')):0)+(r.pov?charge('miles')*charge('mileRate'):0)+(r.rental?charge('rentalCost')+charge('fuel'):0)+(r.rail?charge('railCost'):0)+((r.pov||r.rental)?charge('tolls'):0);
 const extras=charge('registration')+charge('misc')+(r.trip==='Overnight'?charge('parking')+charge('resort'):0);
 return {lodging,mie,transport,extras,total:Math.round((lodging+mie+transport+extras)*100)/100};
}
const inp=(k,t,v,type='text')=>'<label>'+t+'<input name="'+k+'" type="'+type+'" '+(type==='number'?'min="0" step="0.01" ':'')+'value="'+esc(v)+'"></label>';
const sel=(k,t,v,opts)=>'<label>'+t+'<select name="'+k+'">'+opts.map(o=>'<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select></label>';
const btn=(a,t,cls='')=>'<button type="button" class="'+cls+'" data-act="'+a+'">'+t+'</button>';
const group=(t,s)=>'<fieldset><legend>'+t+'</legend><div class="grid">'+s+'</div></fieldset>';
const check=(r,k,t)=>'<label><span><input type="checkbox" name="'+k+'" '+(r[k]?'checked':'')+'> '+t+'</span></label>';
function editor(r){
 const f=(k,t,type)=>inp(k,t,r[k],type), m=(k,t)=>f(k,t,'number');
 return '<h1>'+number(r)+'</h1><p class="pill">'+r.status+'</p><form id="editor">'+
 group('Traveler',f('name','Traveler name')+f('email','Email (optional)','email')+f('supervisor','Supervisor')+sel('org','Organization',r.org,['GDIT','Subcontractor'])+(r.org==='Subcontractor'?f('company','Subcontractor company'):''))+
 group('Trip', '<label>Purpose<textarea name="purpose">'+esc(r.purpose)+'</textarea></label><label>Travel categories<select name="types" multiple>'+purposes.map(x=>'<option '+(r.types.includes(x)?'selected':'')+'>'+x+'</option>').join('')+'</select></label>'+sel('region','Region',r.region,['Domestic','International'])+sel('trip','Trip type',r.trip,['Same-Day','Overnight'])+f('start','Departure','date')+f('end','Return','date'))+
 r.stops.map((s,i)=>{const q=(k,t,type)=>inp('stop.'+i+'.'+k,t,s[k],type);return group('Destination '+(i+1),q('city','City')+q('region','State / province and country')+q('start','First day here','date')+(r.trip==='Overnight'?q('lodge','Lodging rate per night','number')+q('mie','Daily M&IE rate','number')+q('quote','Quoted nightly lodging','number')+(Number(s.quote)>Number(s.lodge)?q('why','Above-rate justification'):'')+btn('rate:'+i,'Load sample rates'):'')+(i?btn('remove:'+i,'Remove destination'):''));}).join('')+btn('stop','Add destination')+
 group('Transportation',check(r,'air','Air')+check(r,'rental','Rental car')+check(r,'pov','Personal vehicle')+check(r,'rail','Rail')+(r.air?m('airfare','Airfare estimate')+sel('airport','Airport transportation',r.airport,['Parking','Uber','Taxi','Shuttle','Dropped Off','Public Transit'])+(r.airport==='Dropped Off'?m('dropMiles','Drop-off miles'):m('airportCost','Airport transportation estimate')):'')+(r.rental?m('rentalCost','Rental estimate')+m('fuel','Fuel / EV charging'):'')+(r.pov?m('miles','Personal vehicle miles'):'')+((r.pov||(r.air&&r.airport==='Dropped Off'))?m('mileRate','Approved mileage rate'):'')+(r.rail?m('railCost','Rail estimate'):'')+((r.pov||r.rental)?m('tolls','Tolls'):''))+
 group('Other expenses',m('registration','Conference registration')+m('misc','Miscellaneous expenses')+(r.trip==='Overnight'?m('parking','Hotel parking')+m('resort','Resort fees'):''))+
 group('Supporting documents','<label>Supporting document names<input type="file" id="attach" multiple></label><div>'+r.files.map(esc).join('<br>')+'</div>')+
 '<section id="estimate"></section><div class="bar">'+btn('save','Save draft')+btn('submit','Submit for review','primary')+'</div></form>';
}
function estimate(r){const c=cost(r);return '<h2>Estimated authorization '+usd(c.total)+'</h2><div class="grid"><span>Lodging '+usd(c.lodging)+'</span><span>M&IE '+usd(c.mie)+'</span><span>Transportation '+usd(c.transport)+'</span><span>Other expenses '+usd(c.extras)+'</span></div>'}
function canReview(r){return r.status===role()||(r.status==='Coordinator Review'&&role()==='GTAS Coordinator')}
function detail(r){
 return '<h1>'+number(r)+'</h1><p class="pill">'+r.status+'</p><section><h2>'+esc(r.name)+'</h2><p>'+esc(r.purpose)+'</p><p>'+esc(r.start)+' to '+esc(r.end)+' / '+r.stops.map(s=>esc(s.city+', '+s.region)).join(' → ')+'</p><p>Supervisor '+esc(r.supervisor)+' / '+esc(r.org==='Subcontractor'?r.company:r.org)+'</p><p>Supporting documents '+(r.files.map(esc).join(', ')||'—')+'</p>'+estimate(r)+'<p>Submitted authorization <strong>'+usd(r.total)+'</strong> / Actual '+usd(r.actual)+'</p></section>'+
 (canReview(r)?'<section><label>Decision comments<textarea id="comments"></textarea></label><div class="bar">'+btn('approve','Approve','primary')+btn('return','Return for revision')+btn('reject','Reject')+(r.status==='Program Manager'?btn('delegate','Delegate to coordinator'):'')+'</div></section>':'')+
 (r.approved?btn('print','Print authorization / Save as PDF'):'')+
 (role()==='GTAS Coordinator'&&r.status==='Approved'?btn('completed','Mark travel completed'):'')+
 (role()==='GTAS Coordinator'&&r.status==='Travel Completed'?'<section><div class="grid">'+inp('actual','Actual job cost',r.actual,'number')+inp('posted','Date posted',today,'date')+inp('notes','Cost notes (optional)','')+'</div>'+btn('close','Post cost and close')+btn('closeNoCost','Close without posted cost')+'</section>':'')+
 '<section><h2>Decision history</h2>'+ (r.log.length?r.log.map(l=>'<p><strong>'+esc(l.event)+'</strong> / '+esc(l.actor)+' / '+esc(l.at)+(l.comment?' — '+esc(l.comment):'')+'</p>').join(''):'<p class="muted">No recorded decisions.</p>')+'</section>';
}
function reportRows(){return db.requests.filter(r=>r.start.slice(0,7)===month&&r.approved)}
function render(){
 const r=db.requests.find(x=>x.id===current), edit=r&&['Draft','Returned'].includes(r.status)&&['Traveler','GTAS Coordinator'].includes(role());
 if(page==='detail'&&r){view.innerHTML=edit?editor(r):detail(r);if(edit)$('#estimate').innerHTML=estimate(r);return}
 if(page==='report'){view.innerHTML='<h1>Monthly Program Manager report</h1><label>Departure month<input id="month" type="month" value="'+esc(month)+'"></label><section>'+reportRows().map(r=>'<div class="row"><div><strong>'+esc(r.name)+'</strong><br>'+r.stops.map(s=>esc(s.city)).join(' → ')+'<br>'+esc(r.start)+' to '+esc(r.end)+'</div><span>Authorized '+usd(r.total)+'</span><span>Actual '+usd(r.actual)+'</span><span>Variance '+usd(r.actual==null?null:r.actual-r.total)+'</span></div>').join('')+(reportRows().length?'':'<p>No approved trips in this month.</p>')+'</section>'+btn('csv','Download CSV');return}
 const queue=db.requests.filter(r=>canReview(r)).length;
 view.innerHTML='<h1>Travel authorizations</h1><p>'+queue+' awaiting your workspace role / '+db.requests.filter(r=>!['Closed','Rejected'].includes(r.status)).length+' open requests</p><section aria-label="Travel requests">'+db.requests.slice().reverse().map(x=>'<div class="row"><div><strong>'+esc(x.name||'Untitled request')+'</strong><br><small>'+number(x)+' / '+esc(x.stops.map(s=>s.city).filter(Boolean).join(' → ')||'Itinerary pending')+'</small></div><span class="pill">'+x.status+'</span><span>'+usd(x.total)+'</span>'+btn('open:'+x.id,'Open')+'</div>').join('')+'</section>';
}
function validate(r){
 if(!r.name.trim()||!r.supervisor.trim()||!r.purpose.trim()||!r.types.length||(r.org==='Subcontractor'&&!r.company.trim()))return 'Complete traveler, supervisor, organization and trip purpose fields.';
 if(r.email&&!$('#editor [name=email]').validity.valid)return 'Enter a valid traveler email.';
 if(!r.start||!r.end||(r.trip==='Same-Day'?r.start!==r.end:r.start>=r.end))return 'Check the departure and return dates against the trip type.';
 if(r.stops[0].start!==r.start||r.stops.some((s,i)=>!s.city.trim()||!s.region.trim()||!s.start||s.start>r.end||(i&&s.start<=r.stops[i-1].start)))return 'Enter each destination and its dates in order, starting on departure day.';
 if(r.trip==='Overnight'&&r.stops.some(s=>s.lodge===''||s.mie===''||(Number(s.quote)>Number(s.lodge)&&!s.why.trim())))return 'Enter lodging and M&IE rates and justify any above-rate quote.';
 if([...$('#editor').querySelectorAll('input[type=number]')].some(x=>!x.validity.valid))return 'Use nonnegative amounts with up to two decimal places.';
 if((Number(r.pov?r.miles:0)+Number(r.air&&r.airport==='Dropped Off'?r.dropMiles:0)>0)&&!(Number(r.mileRate)>0))return 'Enter the approved mileage rate.';
}
function log(r,event,comment=''){r.log.push({event,comment,actor:role(),at:new Date().toLocaleString()})}
document.addEventListener('input',e=>{
 const r=db.requests.find(x=>x.id===current), x=e.target;
 if(!r||!x.closest('#editor')||x.type==='file'||!x.name)return;
 const v=x.multiple?[...x.selectedOptions].map(o=>o.value):x.type==='checkbox'?x.checked:x.value;
 if(x.name.startsWith('stop.')){const [,i,k]=x.name.split('.');r.stops[i][k]=v}else{if(x.name==='start'&&r.stops[0].start===r.start)r.stops[0].start=v;r[x.name]=v}
 $('#estimate').innerHTML=estimate(r);
});
document.addEventListener('change',e=>{
 const r=db.requests.find(x=>x.id===current),x=e.target;
 if(x.id==='month'){month=x.value;render()}
 if(x.id==='role')render();
 if(x.id==='attach'&&r){r.files.push(...[...x.files].map(f=>f.name));render()}
 if(x.closest('#editor')&&(x.type==='checkbox'||['org','trip','airport','start'].includes(x.name)||x.name.endsWith('.quote')||x.name.endsWith('.lodge')))render();
});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;
 const [a,id]=b.dataset.act.split(':'), r=db.requests.find(x=>x.id===current);
 $('#notice').textContent='';
 if(a==='home'||a==='report'){page=a;render();return}
 if(a==='new'){if(!['Traveler','GTAS Coordinator'].includes(role())){$('#notice').textContent='Switch to Traveler or GTAS Coordinator to create a request.';return}const n={...blank(),id:db.next++};n.number=number(n);db.requests.push(n);current=n.id;page='detail';persist();render();return}
 if(a==='open'){current=Number(id);page='detail';render();return}
 if(a==='csv'){const rows=[['Traveler','Destination','Departure','Return','Authorized','Actual','Variance'],...reportRows().map(x=>[x.name,x.stops.map(s=>s.city).join(' / '),x.start,x.end,x.total,x.actual,x.actual==null?'':(x.actual-x.total).toFixed(2)])];const csv=rows.map(row=>row.map(v=>{let s=String(v??'');if(typeof v==='string'&&/^[=+@\-\t\r\n]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const l=document.createElement('a');l.href=url;l.download='GTAS-'+month+'.csv';l.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}
 if(!r)return;
 if(a==='stop')r.stops.push({...stop(),start:r.end});
 if(a==='remove'&&Number(id)>0)r.stops.splice(Number(id),1);
 if(a==='rate'){const s=r.stops[id], v=sampleRates[s.city.trim()];if(v&&r.region==='Domestic'){[s.lodge,s.mie]=v}else{$('#notice').textContent='Fictional lookup covers Arlington, Richmond and Denver. For other destinations enter demonstration rates manually.'}}
 if(a==='save'){persist();if(!$('#notice').textContent)$('#notice').textContent='Draft saved in this browser.'}
 if(a==='submit'){const problem=validate(r);if(problem){$('#notice').textContent=problem;return}r.cycle++;r.total=cost(r).total;r.status=stages[0];log(r,'Submitted for Program Manager review');persist()}
 if(['approve','delegate','return','reject'].includes(a)&&canReview(r)){log(r,{approve:'Approved stage',delegate:'Delegated Program Manager review',return:'Returned for revision',reject:'Rejected'}[a],$('#comments').value.trim());if(a==='approve'){const next=r.status==='Coordinator Review'?1:stages.indexOf(r.status)+1;r.status=stages[next]||'Approved';if(r.status==='Approved'){r.approved=today;log(r,'Authorization available')}}else r.status={delegate:'Coordinator Review',return:'Returned',reject:'Rejected'}[a];persist()}
 if(a==='completed'&&r.status==='Approved'&&role()==='GTAS Coordinator'){if(r.end>today){$('#notice').textContent='Travel can be marked complete on or after its return date.';return}r.status='Travel Completed';log(r,r.status);persist()}
 if(['close','closeNoCost'].includes(a)&&r.status==='Travel Completed'&&role()==='GTAS Coordinator'){const x=$('[name=actual]'), d=$('[name=posted]');if(a==='close'&&(!x.value||!x.validity.valid||!d.value||d.value>today)){ $('#notice').textContent='Enter an actual cost and valid posting date.';return}r.actual=a==='close'?Number(x.value):null;r.posted=a==='close'?d.value:'';r.status='Closed';log(r,a==='close'?'Actual job cost posted and closed':'Closed without actual job cost',$('[name=notes]').value);persist()}
 if(a==='print'&&r.approved){window.print();return}
 render();
});
render();
</script></html>
