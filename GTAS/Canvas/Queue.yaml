- FindNumberLabel:
    Control: Label@2.5.1
    Properties:
      Text: "=\"Request number\""
      X: "=24"
      Y: "=155"
      Width: "=310"
      Height: "=32"
      Color: "=ColorValue(\"#21409A\")"
- FindNumber:
    Control: Classic/TextInput@2.3.2
    Properties:
      Default: "=\"\""
      X: "=24"
      Y: "=186"
      Width: "=310"
      Height: "=36"
      AccessibleLabel: "=\"Request number\""
- FindRequest:
    Control: Classic/Button@2.2.0
    Properties:
      Text: "=\"Open request\""
      X: "=350"
      Y: "=186"
      Width: "=150"
      Height: "=38"
      Fill: "=ColorValue(\"#21409A\")"
      Color: "=Color.White"
      OnSelect: "=Set(r,LookUp(GTASRequests,Title=Trim(FindNumber.Text))); If(IsBlank(r),Notify(\"Request not found\",NotificationType.Error),If(r.Status in [\"Draft\",\"Returned\"],ClearCollect(Stops,ForAll(Table(ParseJSON(r.ItineraryJson)),{City:Text(ThisRecord.Value.City),Region:Text(ThisRecord.Value.Region),Start:DateValue(Text(ThisRecord.Value.Start)),Lodge:Value(ThisRecord.Value.Lodge),Mie:Value(ThisRecord.Value.Mie),Quote:Value(ThisRecord.Value.Quote),Why:Text(ThisRecord.Value.Why)})); Navigate(EditTrip),Navigate(Review)))"
- QueueList:
    Control: Label@2.5.1
    Properties:
      Text: "=Concat(FirstN(SortByColumns(GTASRequests,\"ID\",SortOrder.Descending),12),Title & \"   \u2022   \" & Traveler & \"   \u2022   \" & Status,Char(10)&Char(10))"
      X: "=24"
      Y: "=254"
      Width: "=1120"
      Height: "=456"
      Color: "=ColorValue(\"#21409A\")"
      VerticalAlign: "=VerticalAlign.Top"
